basePath: /api/v1
definitions:
  github_com_gwi_platform-go-challenge_internal_models.CreateAssetRequest:
    properties:
      asset:
        description: Raw JSON to parse dynamically
        items:
          type: integer
        type: array
      user_id:
        description: User reference (e.g., "user1")
        type: string
    type: object
  github_com_gwi_platform-go-challenge_internal_models.Favorite:
    properties:
      added_at:
        type: string
      asset:
        description: The asset object
      asset_id:
        description: Asset reference (e.g., "chart1")
        type: string
      list_name:
        description: List name (e.g., "default", "work", "personal")
        type: string
      list_reference:
        description: List reference (e.g., "list_user1_default")
        type: string
      reference:
        description: API reference (e.g., "fav_user1_favorite1")
        type: string
      sort_order:
        description: Sort order within the list (0-based, lower numbers appear first)
        type: integer
      updated_at:
        type: string
      user_id:
        description: User reference (e.g., "user1")
        type: string
    type: object
  github_com_gwi_platform-go-challenge_internal_models.List:
    properties:
      created_at:
        type: string
      id:
        description: Internal database ID
        type: integer
      name:
        description: List name (e.g., "default", "work", "personal")
        type: string
      reference:
        description: API reference (e.g., "list_user1_default")
        type: string
      updated_at:
        type: string
      user_id:
        description: User reference (e.g., "user1")
        type: string
    type: object
  github_com_gwi_platform-go-challenge_internal_models.PaginatedResponse:
    properties:
      data: {}
      has_next:
        type: boolean
      has_prev:
        type: boolean
      page:
        type: integer
      page_size:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: A RESTful API for managing user favorites, lists, and assets (charts,
    insights, audiences)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Favorites API
  version: "1.0"
paths:
  /assets:
    get:
      consumes:
      - application/json
      description: Retrieves all assets with pagination and optional filters (asset_type,
        date_from, date_to)
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 20)'
        in: query
        name: page_size
        type: integer
      - description: Filter by asset type (chart, insight, audience)
        in: query
        name: asset_type
        type: string
      - description: Filter assets created after this date (ISO 8601)
        in: query
        name: date_from
        type: string
      - description: Filter assets created before this date (ISO 8601)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gwi_platform-go-challenge_internal_models.PaginatedResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all assets
      tags:
      - assets
    post:
      consumes:
      - application/json
      description: Creates a new asset (chart, insight, or audience). Asset ID is
        automatically generated.
      parameters:
      - description: Asset creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_gwi_platform-go-challenge_internal_models.CreateAssetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created asset
          schema: {}
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new asset
      tags:
      - assets
  /assets/{assetReference}:
    delete:
      consumes:
      - application/json
      description: Deletes an asset by its reference. This will also remove all favorites
        that reference this asset.
      parameters:
      - description: Asset reference (ID)
        in: path
        name: assetReference
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Asset deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Asset not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an asset
      tags:
      - assets
    get:
      consumes:
      - application/json
      description: Retrieves a specific asset by its reference
      parameters:
      - description: Asset reference (ID)
        in: path
        name: assetReference
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Asset not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get asset by reference
      tags:
      - assets
    patch:
      consumes:
      - application/json
      description: Updates an existing asset by its reference
      parameters:
      - description: Asset reference (ID)
        in: path
        name: assetReference
        required: true
        type: string
      - description: Asset update request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Asset not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an asset
      tags:
      - assets
  /health:
    get:
      consumes:
      - application/json
      description: Returns the health status of the API service
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            additionalProperties: true
            type: object
      summary: Health check endpoint
      tags:
      - health
  /users/{userID}/favorites:
    get:
      consumes:
      - application/json
      description: Retrieves all favorites for a user across all lists with pagination
        and optional filters
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 20)'
        in: query
        name: page_size
        type: integer
      - description: Filter by asset type (chart, insight, audience)
        in: query
        name: asset_type
        type: string
      - description: Filter favorites added after this date (ISO 8601)
        in: query
        name: date_from
        type: string
      - description: Filter favorites added before this date (ISO 8601)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gwi_platform-go-challenge_internal_models.PaginatedResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all favorites for a user
      tags:
      - favorites
    post:
      consumes:
      - application/json
      description: Adds an asset to the user's default favorites list
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: Add favorite request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_gwi_platform-go-challenge_internal_models.Favorite'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Asset or list not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add favorite to default list
      tags:
      - favorites
  /users/{userID}/favorites/{assetID}:
    delete:
      consumes:
      - application/json
      description: Removes an asset from a user's favorites in the default list
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: Asset ID (reference)
        in: path
        name: assetID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Favorite removed successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Favorite not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove favorite from default list
      tags:
      - favorites
  /users/{userID}/favorites/{assetID}/description:
    patch:
      consumes:
      - application/json
      description: Updates the description of an asset in a user's favorites
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: Asset ID (reference)
        in: path
        name: assetID
        required: true
        type: string
      - description: Update description request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Description updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Favorite not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update favorite description
      tags:
      - favorites
  /users/{userID}/favorites/{favoriteReference}/sort-order:
    patch:
      consumes:
      - application/json
      description: Updates the sort order of a favorite within a list
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: Favorite reference
        in: path
        name: favoriteReference
        required: true
        type: string
      - description: Update sort order request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Sort order updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Favorite not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update favorite sort order
      tags:
      - favorites
  /users/{userID}/lists:
    get:
      consumes:
      - application/json
      description: Retrieves all favorites lists for a user with pagination support
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 20)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gwi_platform-go-challenge_internal_models.PaginatedResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all lists for a user
      tags:
      - lists
    post:
      consumes:
      - application/json
      description: Creates a new favorites list for a user
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: List creation request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_gwi_platform-go-challenge_internal_models.List'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new list
      tags:
      - lists
  /users/{userID}/lists/{listReference}:
    delete:
      consumes:
      - application/json
      description: Deletes a list and all its associated favorites
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: List reference
        in: path
        name: listReference
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: List not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a list
      tags:
      - lists
    get:
      consumes:
      - application/json
      description: Retrieves a specific list by its reference
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: List reference
        in: path
        name: listReference
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gwi_platform-go-challenge_internal_models.List'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: List not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get list by reference
      tags:
      - lists
  /users/{userID}/lists/{listReference}/favorites:
    get:
      consumes:
      - application/json
      description: Retrieves paginated favorites for a user in a specific list with
        optional filters
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: List reference
        in: path
        name: listReference
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 20)'
        in: query
        name: page_size
        type: integer
      - description: Filter by asset type (chart, insight, audience)
        in: query
        name: asset_type
        type: string
      - description: Filter favorites added after this date (ISO 8601)
        in: query
        name: date_from
        type: string
      - description: Filter favorites added before this date (ISO 8601)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gwi_platform-go-challenge_internal_models.PaginatedResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get favorites in a list
      tags:
      - favorites
    post:
      consumes:
      - application/json
      description: Adds an asset to a user's favorites in a specific list
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: List reference
        in: path
        name: listReference
        required: true
        type: string
      - description: Add favorite request
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_gwi_platform-go-challenge_internal_models.Favorite'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Asset or list not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add favorite to a list
      tags:
      - favorites
  /users/{userID}/lists/{listReference}/favorites/{assetID}:
    delete:
      consumes:
      - application/json
      description: Removes an asset from a user's favorites in a specific list
      parameters:
      - description: User ID (reference)
        in: path
        name: userID
        required: true
        type: string
      - description: List reference
        in: path
        name: listReference
        required: true
        type: string
      - description: Asset ID (reference)
        in: path
        name: assetID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Favorite removed successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Favorite not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove favorite from a list
      tags:
      - favorites
schemes:
- http
- https
swagger: "2.0"
